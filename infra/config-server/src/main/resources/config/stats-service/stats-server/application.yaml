server:
  port: 0
spring:
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
          lob:
            non_contextual_creation: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    hikari:
      connection-timeout: 2000    # 2 сек
      idle-timeout: 10000
      max-lifetime: 30000
      maximum-pool-size: 10
      minimum-idle: 2
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/ewm-stats
    username: postgres
    password: password